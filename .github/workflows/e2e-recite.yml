# Manual end-to-end check of recitation mode with a real recitation as the microphone.
name: Check recitation mode
on: workflow_dispatch
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: sudo apt-get install -y ffmpeg >/dev/null 2>&1
      - name: Test recording (Husary, 14:1-14:5 without 14:3)
        run: |
          for a in 001 002 004 005; do curl -sL -o $a.mp3 https://everyayah.com/data/Husary_128kbps/014$a.mp3; done
          ffmpeg -loglevel error -f lavfi -t 2 -i anullsrc=r=48000:cl=mono -i 001.mp3 -i 002.mp3 -i 004.mp3 -i 005.mp3 \
            -filter_complex "[0:a][1:a][2:a][3:a][4:a]concat=n=5:v=0:a=1,aresample=48000,aformat=channel_layouts=mono" -ar 48000 -ac 1 rec.wav
          ffprobe -v error -show_entries format=duration -of csv=p=0 rec.wav
      - name: The model on its own, straight from the recording
        run: |
          M=https://huggingface.co/muhdur/tilawi-fastconformer-quran/resolve/e9448a0e84f3adb64c28b7a8db501dd8e0e59a84
          curl -sL -o model.onnx $M/fastconformer_full_mixed.onnx && curl -sL -o vocab.json $M/vocab.json
          npm i --no-save onnxruntime-node@1.22 && node scripts/e2e/model-check.mjs rec.wav model.onnx vocab.json
      - run: npm i --no-save playwright@1.56 && npx playwright install --with-deps chromium >/dev/null
      - run: (cd dist && python3 -m http.server 8080 >/dev/null 2>&1 &) && sleep 2 && node scripts/e2e/recite.mjs "$PWD/rec.wav"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: recite-screenshot, path: recite.png }
