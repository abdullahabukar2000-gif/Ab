# Manual check of the recitation files (see scripts/check-audio.py).
name: Check recitations
on:
  workflow_dispatch:
    inputs:
      surahs:
        description: Surahs to check in detail, comma separated (empty = skip)
        default: ''
      pair:
        description: 'Optional: SURAH TEST_FOLDER REF_FOLDER for a file-by-file comparison'
        default: ''
      probe:
        description: 'Optional: look up a reciter name (regex) in the recitation sites\' lists'
        default: ''
      reciters:
        description: Reciters for the whole-Quran size check (empty = all)
        default: ''
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y ffmpeg >/dev/null 2>&1 || true
      - if: inputs.probe != ''
        run: python3 scripts/probe-reciter.py "${{ inputs.probe }}"
      - if: inputs.pair != ''
        run: python3 scripts/check-audio-pair.py ${{ inputs.pair }}
      - if: inputs.pair == '' && inputs.probe == ''
        run: python3 scripts/check-audio-sizes.py "${{ inputs.reciters }}"
      - if: inputs.surahs != ''
        run: python3 scripts/check-audio.py "${{ inputs.surahs }}"
